# MIND Conformance Test: pub before import has no derivation
# Specification reference: spec/v1.0/language.md#visibility
# Decision: DN-83 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "pub stands only before a named item; pub import std.vec; is refused with E1101 at import"
category: syntax
profile: cpu

input:
  source: |
    pub import std.vec;

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E1101
    location:
      line: 1
      column: 5
    count: 1
