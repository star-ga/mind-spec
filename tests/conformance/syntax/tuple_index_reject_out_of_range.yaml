# MIND Conformance Test: a tuple index that is not less than the number of elements is refused with E2404
# Specification reference: spec/v1.0/language.md#tuple-index
# Category: syntax
# Profile: cpu

description: "t.2 on a tuple of two elements is refused with E2404"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let t = (4, 5);
        return t.2;
    }

expected:
  status: error
  error:
    code: E2404
