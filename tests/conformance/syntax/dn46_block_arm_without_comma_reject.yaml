# MIND Conformance Test: a block arm with no comma is refused with E1103 at the insertion point
# Specification reference: spec/v1.0/language.md#patterns-and-match
# Decision: DN-46 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a block arm with no comma is refused with E1103 at the insertion point"
category: syntax
profile: cpu

input:
  source: |
    fn f(x: i64) -> i64 {
        return match x {
            0 => { 1 }
            _ => 2,
        };
    }

    fn main() -> i64 {
        return f(0);
    }

expected:
  status: error
  error:
    code: E1103
    location:
      line: 3
      column: 19
  fix:
    class: EXACT
    source: |
      fn f(x: i64) -> i64 {
          return match x {
              0 => { 1 },
              _ => 2,
          };
      }

      fn main() -> i64 {
          return f(0);
      }
