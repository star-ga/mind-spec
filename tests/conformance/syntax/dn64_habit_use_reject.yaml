# MIND Conformance Test: use is a habit form of E1105
# Specification reference: spec/v1.0/errors.md#e1105-form-that-mind-writes-another-way
# Decision: DN-64 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "use std.vec; is refused with E1105 at use; the fix is import std.vec;"
category: syntax
profile: cpu

input:
  source: |
    use std.vec;

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E1105
    location:
      line: 1
      column: 1
    count: 1
  fix:
    class: EXACT
    source: |
      import std.vec;

      fn main() -> i64 {
          return 0;
      }
