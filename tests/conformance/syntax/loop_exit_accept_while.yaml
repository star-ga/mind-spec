# MIND Conformance Test: continue and break inside a while loop; the program returns 8
# Specification reference: spec/v1.0/language.md#loop-exits
# Category: syntax
# Profile: cpu

description: "continue and break inside a while loop; the program returns 8"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let i = 0;
        let s = 0;
        while i < 10 {
            i = i + 1;
            if i == 2 {
                continue
            };
            if i > 4 {
                break
            };
            s = s + i;
        };
        return s;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 8
