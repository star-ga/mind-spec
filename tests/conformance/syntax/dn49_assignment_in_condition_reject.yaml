# MIND Conformance Test: if x = 1 { } is refused with E1107, whose message names ==
# Specification reference: spec/v1.0/language.md#bindings-and-assignment
# Decision: DN-49 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "if x = 1 { } is refused with E1107, whose message names =="
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let mut x = 0;
        if x = 1 {
            return 1;
        }
        return 0;
    }

expected:
  status: error
  error:
    code: E1107
    message_contains: "=="
    location:
      line: 3
      column: 10
