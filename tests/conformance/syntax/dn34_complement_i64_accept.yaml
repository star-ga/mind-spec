# MIND Conformance Test: ~3 is -4 in i64
# Specification reference: spec/v1.0/language.md#operand-and-condition-types
# Decision: DN-34 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "~3 is -4 in i64; the program returns 4"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x: i64 = 3;
        return ~x + 8;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 4
