# MIND Conformance Test: the last index of an axis
# Specification reference: spec/v1.0/ir.md#index-bounds
# Category: syntax
# Profile: cpu

description: "the index 3 is less than the extent 4"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: [i64; 4] = [1, 2, 3, 4];
        return a[3];
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 4
