# MIND Conformance Test: Core v1 has no references
# Specification reference: spec/v1.0/language.md#operand-and-condition-types
# Decision: DN-73 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "Core v1 has no references; let y = &x; is refused with E1101"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x = 1;
        let y = &x;
        return 0;
    }

expected:
  status: error
  error:
    code: E1101
    location:
      line: 3
      column: 13
