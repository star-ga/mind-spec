# MIND Conformance Test: an if at a statement start ends at its closing brace
# Specification reference: spec/v1.0/language.md#block-like-statements
# Category: syntax
# Profile: cpu

description: "if true { 2 } else { 3 } - x; is the statement if, of type i64, and then the statement - x;; the source is refused"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x = 1;
        if true { 2 } else { 3 } - x;
        return 0;
    }

expected:
  status: error
  error:
    code: E2001
