# MIND Conformance Test: an integer literal where a floating-point type is expected
# Specification reference: spec/v1.0/types.md#type-of-a-literal
# Category: syntax
# Profile: cpu

description: "1 where f64 is expected"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let y: f64 = 1;
        return 0;
    }

expected:
  status: error
  error:
    code: E2001
