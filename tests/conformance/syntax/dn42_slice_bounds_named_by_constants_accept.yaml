# MIND Conformance Test: a[E::B] with two constants is the slice from E with the step B
# Specification reference: spec/v1.0/language.md#tuple-index
# Decision: DN-42 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "inside an index :: is two slice colons, so a[E::B] with const E and const B is the slice from E with the step B"
category: syntax
profile: cpu

input:
  source: |
    const E: i64 = 1;
    const B: i64 = 2;

    fn main() -> i64 {
        let a: [i64; 4] = [1, 2, 3, 4];
        let b = a[E::B];
        return b[0] + b[1];
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 6
