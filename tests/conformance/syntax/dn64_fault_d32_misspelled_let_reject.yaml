# MIND Conformance Test: syntax fault d32 (misspelled let): refused with E1104 at 2:5, one diagnostic
# Specification reference: spec/v1.0/errors.md#e1xxx-lexical-and-syntax-errors
# Decision: DN-64 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "syntax fault d32 (misspelled let): refused with E1104 at 2:5, one diagnostic"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        lett x = 1;
        return x;
    }

expected:
  status: error
  error:
    code: E1104
    message_contains: "`let`"
    location:
      line: 2
      column: 5
  fix:
    class: EXACT
    source: |
      fn main() -> i64 {
          let x = 1;
          return x;
      }
