# MIND Conformance Test: & with an i32 and an i64 operand
# Specification reference: spec/v1.0/language.md#bitwise-and-shift-operators
# Category: syntax
# Profile: cpu

description: "the operands of & have the same integer type; i32 & i64 is refused with E2004"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: i32 = 1;
        let b: i64 = 2;
        let c = a & b;
        return 0;
    }

expected:
  status: error
  error:
    code: E2004
