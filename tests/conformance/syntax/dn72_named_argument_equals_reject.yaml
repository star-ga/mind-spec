# MIND Conformance Test: dtype = f32 is refused with E1105, which gives dtype: f32
# Specification reference: spec/v1.0/language.md#tensor-operations
# Decision: DN-72 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "dtype = f32 is refused with E1105, which gives dtype: f32"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let t = tensor(3, dtype = f32);
        return 0;
    }

expected:
  status: error
  error:
    code: E1105
    message_contains: "dtype: f32"
    location:
      line: 2
      column: 29
  fix:
    class: EXACT
    source: |
      fn main() -> i64 {
          let t = tensor(3, dtype: f32);
          return 0;
      }
