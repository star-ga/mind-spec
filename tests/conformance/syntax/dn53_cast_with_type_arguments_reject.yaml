# MIND Conformance Test: x as Option<i64> has no derivation and is refused with E1101
# Specification reference: spec/v1.0/language.md#casts
# Decision: DN-53 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "x as Option<i64> has no derivation and is refused with E1101"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x: i64 = 1;
        let o = x as Option<i64>;
        return 0;
    }

expected:
  status: error
  error:
    code: E1101
