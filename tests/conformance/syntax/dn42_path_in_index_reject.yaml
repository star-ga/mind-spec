# MIND Conformance Test: a[E::B] is refused with E1101
# Specification reference: spec/v1.0/language.md#tuple-index
# Decision: DN-42 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a[E::B] is refused with E1101; the path is written a[(E::B)]"
category: syntax
profile: cpu

input:
  source: |
    enum E {
        A,
        B,
    }

    fn main() -> i64 {
        let a: [i64; 2] = [1, 2];
        return a[E::B];
    }

expected:
  status: error
  error:
    code: E1101
