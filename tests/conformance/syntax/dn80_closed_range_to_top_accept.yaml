# MIND Conformance Test: a closed range reaches the top of u8 and never overflows
# Specification reference: spec/v1.0/language.md#loops
# Decision: DN-80 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a closed range reaches the top of u8 and never overflows; the program returns 6"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: u8 = 250;
        let b: u8 = 255;
        let mut n = 0;
        for i in a..=b {
            n += 1;
        }
        return n;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 6
