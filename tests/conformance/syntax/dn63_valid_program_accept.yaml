# MIND Conformance Test: a program with no syntax fault gets no diagnostic
# Specification reference: spec/v1.0/errors.md#e1xxx-lexical-and-syntax-errors
# Decision: DN-63 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a program with no syntax fault gets no diagnostic; the program returns 2"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x = 1;
        return x + 1;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 2
