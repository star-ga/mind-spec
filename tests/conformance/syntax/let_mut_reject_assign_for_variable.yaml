# MIND Conformance Test: an assignment to the variable of a for loop is refused with E2402
# Specification reference: spec/v1.0/language.md#bindings-and-assignment
# Category: syntax
# Profile: cpu

description: "the name that the pattern of a for binds is not mutable; v = 0; is refused with E2402"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let xs: array<i64> = [1, 2, 3];
        for v in xs {
            v = 0;
        }
        return 0;
    }

expected:
  status: error
  error:
    code: E2402
