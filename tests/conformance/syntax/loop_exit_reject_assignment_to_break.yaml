# MIND Conformance Test: a statement that starts with break is the loop exit, never an assignment
# Specification reference: spec/v1.0/language.md#loop-exits
# Category: syntax
# Profile: cpu

description: "break = 5; is refused: a statement that starts with break is the loop exit"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let break = 4;
        break = 5;
        return break;
    }

expected:
  status: error
