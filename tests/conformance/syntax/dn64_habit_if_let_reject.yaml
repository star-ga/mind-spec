# MIND Conformance Test: if let is a habit form of E1105
# Specification reference: spec/v1.0/errors.md#e1105-form-that-mind-writes-another-way
# Decision: DN-64 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "if let Some(x) = o is refused with E1105 at the if; the fix is a match with a wildcard arm"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let o: Option<i64> = Some(3);
        if let Some(x) = o {
            return x;
        }
        return 0;
    }

expected:
  status: error
  error:
    code: E1105
    location:
      line: 3
      column: 5
    count: 1
  fix:
    class: EXACT
    source: |
      fn main() -> i64 {
          let o: Option<i64> = Some(3);
          match o { Some(x) => { return x; }, _ => { }, }
          return 0;
      }
