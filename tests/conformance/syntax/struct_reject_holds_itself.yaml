# MIND Conformance Test: a struct that holds itself has no size
# Specification reference: spec/v1.0/types.md#type-formation
# Category: syntax
# Profile: cpu

description: "struct N holds itself directly"
category: syntax
profile: cpu

input:
  source: |
    struct N {
        next: N,
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E2407
