# MIND Conformance Test: a negative index literal
# Specification reference: spec/v1.0/ir.md#index-bounds
# Category: syntax
# Profile: cpu

description: "-1 is outside the axis; no index counts from the end"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: [i64; 4] = [1, 2, 3, 4];
        return a[-1];
    }

expected:
  status: error
  error:
    code: E3011
