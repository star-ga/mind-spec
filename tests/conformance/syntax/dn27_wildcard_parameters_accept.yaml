# MIND Conformance Test: _ may name two parameters of one function
# Specification reference: spec/v1.0/lexical.md#identifiers
# Decision: DN-27 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "_ may name two parameters of one function; the program returns 3"
category: syntax
profile: cpu

input:
  source: |
    fn f(_: i64, _: i64) -> i64 {
        return 3;
    }

    fn main() -> i64 {
        return f(1, 2);
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 3
