# MIND Conformance Test: a call follows a function name
# Specification reference: spec/v1.0/language.md#field-access-and-method-calls
# Decision: DN-29 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a call follows a function name; f(f(1)) is 3"
category: syntax
profile: cpu

input:
  source: |
    fn f(x: i64) -> i64 {
        return x + 1;
    }

    fn main() -> i64 {
        return f(f(1));
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 3
