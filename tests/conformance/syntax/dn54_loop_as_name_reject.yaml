# MIND Conformance Test: loop is a keyword
# Specification reference: spec/v1.0/language.md#loops
# Decision: DN-54 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "loop is a keyword; let loop = 1; is refused with E1007"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let loop = 1;
        return 0;
    }

expected:
  status: error
  error:
    code: E1007
    location:
      line: 2
      column: 9
