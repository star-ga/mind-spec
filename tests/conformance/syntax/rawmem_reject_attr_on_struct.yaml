# MIND Conformance Test: raw_memory stands only before a function declaration
# Specification reference: spec/v1.0/language.md#raw-memory
# Category: syntax
# Profile: cpu

description: "the attribute raw_memory before a struct"
category: syntax
profile: cpu

input:
  source: |
    #[raw_memory]
    struct S {
        a: i64,
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E2502
