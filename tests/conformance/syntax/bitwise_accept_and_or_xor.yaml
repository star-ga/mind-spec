# MIND Conformance Test: & | ^ on two operands of the same integer type
# Specification reference: spec/v1.0/language.md#bitwise-and-shift-operators
# Category: syntax
# Profile: cpu

description: "12 & 10 is 8, 12 | 10 is 14, 12 ^ 10 is 6; the program returns 28"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: i64 = 12;
        let b: i64 = 10;
        return (a & b) + (a | b) + (a ^ b);
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 28
