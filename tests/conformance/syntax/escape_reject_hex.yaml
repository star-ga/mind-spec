# MIND Conformance Test: The escape \x41 is not defined and is diagnosed
# Specification reference: spec/v1.0/lexical.md#literals, spec/v1.0/errors.md#e1004-invalid-escape-sequence
# Category: syntax
# Profile: cpu

description: "The escape \\x41 is not defined and is diagnosed"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let s = "a\x41b";
        return 0;
    }

expected:
  status: error
  error:
    code: E1004
    message_contains: "escape"
    location:
      line: 2
      column: 15
