# MIND Conformance Test: the omitted parts of a slice
# Specification reference: spec/v1.0/language.md#tuple-index
# Category: syntax
# Profile: cpu

description: "a[:2], a[1:], a[:] and a[0:4:2] are slices of the array a"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a = [1, 2, 3, 4];
        let b = a[:2];
        let c = a[1:];
        let d = a[:];
        let e = a[0:4:2];
        return 0;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 0
