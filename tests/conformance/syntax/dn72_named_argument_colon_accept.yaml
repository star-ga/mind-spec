# MIND Conformance Test: a named argument is written name: value
# Specification reference: spec/v1.0/language.md#tensor-operations
# Decision: DN-72 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a named argument is written name: value; the program returns 0"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let t = tensor(3, dtype: f32);
        return 0;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 0
