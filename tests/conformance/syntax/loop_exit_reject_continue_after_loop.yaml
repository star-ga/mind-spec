# MIND Conformance Test: continue; after the end of a loop is outside every loop
# Specification reference: spec/v1.0/language.md#loop-exits
# Category: syntax
# Profile: cpu

description: "continue; stands after the loop, not in its body; the source is refused"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        while false {
        }
        if true {
            continue;
        };
        return 0;
    }

expected:
  status: error
  error:
    code: E2401
