# MIND Conformance Test: Core v1 has no loop statement; loop { ... } is refused with E2405
# Specification reference: spec/v1.0/language.md#loop-exits
# Category: syntax
# Profile: cpu

description: "loop { } is the name loop and a block with no ; between them; it is refused with E2405"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        loop {
        }
        return 0;
    }

expected:
  status: error
  error:
    code: E2405
