# MIND Conformance Test: Core v1 has no loop statement
# Specification reference: spec/v1.0/language.md#loop-exits
# Category: syntax
# Profile: cpu

description: "loop { ... } is the name loop and a block with no ; between them; the source is refused"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        loop {
            break;
        }
        return 0;
    }

expected:
  status: error
