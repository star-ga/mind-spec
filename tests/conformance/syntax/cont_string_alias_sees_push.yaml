# MIND Conformance Test: an alias of a string sees a push
# Specification reference: spec/v1.0/memory.md#records-and-containers
# Category: syntax
# Profile: cpu

description: "t and s denote one record; after the push t has one byte"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let s = string_new();
        let t = s;
        let r = string_push_byte(s, 97);
        return string_len(t);
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 1
