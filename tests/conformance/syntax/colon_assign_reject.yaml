# MIND Conformance Test: MIND has no operator :=
# Specification reference: spec/v1.0/lexical.md#tokens
# Category: syntax
# Profile: cpu

description: "x := 2; is refused; the assignment is x = 2;"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let mut x = 1;
        x := 2;
        return x;
    }

expected:
  status: error
