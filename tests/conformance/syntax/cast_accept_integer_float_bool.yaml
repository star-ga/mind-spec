# MIND Conformance Test: integer, float and bool casts by the rows of the cast table; the program returns 5
# Specification reference: spec/v1.0/language.md#casts
# Category: syntax
# Profile: cpu

description: "an i64 to i32 cast keeps the low 32 bits, a float to integer cast truncates toward zero, true is 1; the program returns 5"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: i64 = 4294967297;
        let b: i32 = a as i32;
        let c: f64 = 2.5;
        let d: i64 = c as i64;
        let e: i64 = (0.0 - 2.5) as i64;
        let f: i64 = true as i64;
        let g: f64 = 3 as f64;
        return b as i64 + d + e + f + g as i64;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 5
