# MIND Conformance Test: a match arm with an expression body needs its , also as the last arm
# Specification reference: spec/v1.0/language.md#statement-separators
# Category: syntax
# Profile: cpu

description: "match 3 { x => x } has no , after the expression arm; the source is refused"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let v = match 3 {
            x => x
        };
        return v;
    }

expected:
  status: error
