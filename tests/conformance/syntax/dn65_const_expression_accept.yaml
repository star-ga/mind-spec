# MIND Conformance Test: a const initializer is a constant expression
# Specification reference: spec/v1.0/language.md#module-level
# Decision: DN-65 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a const initializer is a constant expression; the program returns 5"
category: syntax
profile: cpu

input:
  source: |
    const K: i64 = 2 + 3;

    fn main() -> i64 {
        return K;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 5
