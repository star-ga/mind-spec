# MIND Conformance Test: the operands of an elementwise operator share a dtype
# Specification reference: spec/v1.0/language.md#tensor-operations
# Category: syntax
# Profile: cpu

description: "a .* b with an f64 and an i64 operand"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: f64 = 1.5;
        let b: i64 = 2;
        let c = a .* b;
        return 0;
    }

expected:
  status: error
  error:
    code: E2004
