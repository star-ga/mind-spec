# MIND Conformance Test: the elementwise operators on two scalars are the plain operators
# Specification reference: spec/v1.0/language.md#tensor-operations
# Category: syntax
# Profile: cpu

description: "6 .* 3 - 6 ./ 3 + (6 .+ 3) .- 1 is 18 - 2 + 9 - 1; the program returns 24"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: i64 = 6;
        let b: i64 = 3;
        return a .* b - a ./ b + (a .+ b) .- 1;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 24
