# MIND Conformance Test: a range index a[1..3] is refused with E2406
# Specification reference: spec/v1.0/language.md#tuple-index
# Category: syntax
# Profile: cpu

description: "a[1..3] is refused with E2406; the slice form is a[1:3]"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: [i64; 4] = [1, 2, 3, 4];
        let b = a[1..3];
        return 0;
    }

expected:
  status: error
  error:
    code: E2406
