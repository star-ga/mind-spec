# MIND Conformance Test: a range index a[1..3] has no derivation and is refused with E1101
# Specification reference: spec/v1.0/language.md#loops
# Decision: DN-47 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a[1..3] is refused with E1101; the message names the slice form a[1:3]"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: [i64; 4] = [1, 2, 3, 4];
        let b = a[1..3];
        return 0;
    }

expected:
  status: error
  error:
    code: E1101
    location:
      line: 3
      column: 16
