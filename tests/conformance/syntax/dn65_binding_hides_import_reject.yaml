# MIND Conformance Test: a binding with the name of an import qualifier in scope is refused with E2730
# Specification reference: spec/v1.0/language.md#module-level
# Decision: DN-65 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a binding with the name of an import qualifier in scope is refused with E2730"
category: syntax
profile: cpu

input:
  source: |
    import std.io;

    fn main() -> i64 {
        let io = 1;
        return io;
    }

expected:
  status: error
  error:
    code: E2730
