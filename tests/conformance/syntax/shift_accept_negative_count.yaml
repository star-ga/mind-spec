# MIND Conformance Test: a negative count uses its two's complement value modulo the width
# Specification reference: spec/v1.0/language.md#bitwise-and-shift-operators
# Category: syntax
# Profile: cpu

description: "on i64, the count -63 is 1 and the count -61 is 3: 1 << -63 is 2 and 64 >> -61 is 8; the program returns 10"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let one: i64 = 1;
        let x: i64 = 64;
        let c: i64 = 0 - 63;
        let d: i64 = 0 - 61;
        return (one << c) + (x >> d);
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 10
