# MIND Conformance Test: a = b = 7
# Specification reference: spec/v1.0/language.md#bindings-and-assignment
# Decision: DN-49 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a = b = 7; is refused with E1107"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let mut a = 1;
        let mut b = 2;
        a = b = 7;
        return a;
    }

expected:
  status: error
  error:
    code: E1107
    location:
      line: 4
      column: 11
