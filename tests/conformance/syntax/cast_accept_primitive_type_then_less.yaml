# MIND Conformance Test: a primitive type name ends the type of a cast
# Specification reference: spec/v1.0/language.md#casts
# Category: syntax
# Profile: cpu

description: "x as i64 < y compares the cast with y; the program returns 1"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x: i32 = 3;
        let y: i64 = 5;
        if x as i64 < y {
            return 1;
        }
        return 0;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 1
