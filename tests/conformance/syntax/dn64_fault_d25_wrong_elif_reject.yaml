# MIND Conformance Test: syntax fault d25 (wrong elif): refused with E1105 at 5:7, one diagnostic
# Specification reference: spec/v1.0/errors.md#e1xxx-lexical-and-syntax-errors
# Decision: DN-64 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "syntax fault d25 (wrong elif): refused with E1105 at 5:7, one diagnostic"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x = 1;
        if x > 0 {
            return 1;
        } elif x < 0 {
            return 2;
        }
        return 0;
    }

expected:
  status: error
  error:
    code: E1105
    message_contains: "else if"
    location:
      line: 5
      column: 7
  fix:
    class: EXACT
    source: |
      fn main() -> i64 {
          let x = 1;
          if x > 0 {
              return 1;
          } else if x < 0 {
              return 2;
          }
          return 0;
      }
