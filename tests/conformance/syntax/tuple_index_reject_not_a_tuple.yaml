# MIND Conformance Test: a tuple index on a value that is not a tuple is refused with E2404
# Specification reference: spec/v1.0/language.md#tuple-index
# Category: syntax
# Profile: cpu

description: "x.0 with x: i64 is refused with E2404"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x: i64 = 3;
        return x.0;
    }

expected:
  status: error
  error:
    code: E2404
