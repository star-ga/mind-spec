# MIND Conformance Test: pub before an item
# Specification reference: spec/v1.0/language.md#visibility
# Decision: DN-83 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "pub before an item; the program returns 5"
category: syntax
profile: cpu

input:
  source: |
    pub fn f() -> i64 {
        return 5;
    }

    fn main() -> i64 {
        return f();
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 5
