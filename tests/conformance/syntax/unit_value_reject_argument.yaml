# MIND Conformance Test: () as an argument for an i64 parameter is a type mismatch
# Specification reference: spec/v1.0/types.md#the-unit-value
# Category: syntax
# Profile: cpu

description: "f(()) where the parameter of f is i64 is refused with E2001"
category: syntax
profile: cpu

input:
  source: |
    fn f(x: i64) -> i64 {
        return x;
    }

    fn main() -> i64 {
        return f(());
    }

expected:
  status: error
  error:
    code: E2001
