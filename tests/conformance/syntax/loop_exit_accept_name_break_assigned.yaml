# MIND Conformance Test: a source with no loop exit derivation uses break as a name; the program returns 5
# Specification reference: spec/v1.0/language.md#loop-exits
# Category: syntax
# Profile: cpu

description: "break = 5; has no loop exit derivation, so break is a name; the program returns 5"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let mut break = 4;
        break = 5;
        return break;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 5
