# MIND Conformance Test: a valid program never gets E1104: lets is a name
# Specification reference: spec/v1.0/errors.md#e1104-misspelled-keyword
# Decision: DN-64 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a valid program never gets E1104: lets is a name; the program returns 1"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let lets = 1;
        return lets;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 1
