# MIND Conformance Test: a record literal in the head of an if is written in parentheses
# Specification reference: spec/v1.0/language.md#record-literals
# Decision: DN-28 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a record literal in the head of an if is written in parentheses; the program returns 1"
category: syntax
profile: cpu

input:
  source: |
    struct P {
        x: i64,
        y: i64,
    }

    fn main() -> i64 {
        let p = P { x: 1, y: 2 };
        if p.x == (P { x: 1, y: 3 }).x {
            return 1;
        }
        return 0;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 1
