# MIND Conformance Test: an integer literal outside the range of its type
# Specification reference: spec/v1.0/types.md#type-of-a-literal
# Category: syntax
# Profile: cpu

description: "3000000000 is outside the range of i32"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let b: i32 = 3000000000;
        return 0;
    }

expected:
  status: error
  error:
    code: E2408
