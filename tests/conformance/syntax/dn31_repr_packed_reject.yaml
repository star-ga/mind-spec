# MIND Conformance Test: #[repr(packed)] has no row in the attribute table and is refused with E2502
# Specification reference: spec/v1.0/language.md#attributes
# Decision: DN-31 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "#[repr(packed)] has no row in the attribute table and is refused with E2502"
category: syntax
profile: cpu

input:
  source: |
    #[repr(packed)]
    struct S {
        a: i64,
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E2502
