# Decision: DN-63 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "three faults in three functions give three diagnostics, one for each item; the first is E1101 at 2:18"
category: syntax
profile: cpu

input:
  source: |
    fn a() -> i64 {
        let x = (1 + ;
        return x;
    }

    fn b() -> i64 {
        return 2 * * 3;
    }

    fn c(x i64) -> i64 {
        return x;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E1101
    location:
      line: 2
      column: 18
    count: 3
