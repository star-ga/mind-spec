# MIND Conformance Test: an index operator on a tuple has no meaning and is refused with E2404
# Specification reference: spec/v1.0/language.md#tuple-index
# Category: syntax
# Profile: cpu

description: "t[0] on a tuple is refused with E2404; the form is t.0"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let t = (4, 5);
        return t[0];
    }

expected:
  status: error
  error:
    code: E2404
