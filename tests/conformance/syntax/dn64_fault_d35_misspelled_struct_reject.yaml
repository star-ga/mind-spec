# MIND Conformance Test: syntax fault d35 (misspelled struct): refused with E1104 at 1:1, one diagnostic
# Specification reference: spec/v1.0/errors.md#e1xxx-lexical-and-syntax-errors
# Decision: DN-64 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "syntax fault d35 (misspelled struct): refused with E1104 at 1:1, one diagnostic"
category: syntax
profile: cpu

input:
  source: |
    struc S {
        a: i64,
    }

    fn main() -> i64 {
        return 1;
    }

expected:
  status: error
  error:
    code: E1104
    message_contains: "`struct`"
    location:
      line: 1
      column: 1
  fix:
    class: EXACT
    source: |
      struct S {
          a: i64,
      }

      fn main() -> i64 {
          return 1;
      }
