# MIND Conformance Test: a record literal without parentheses in the head of an if is refused with E1101
# Specification reference: spec/v1.0/language.md#record-literals
# Decision: DN-28 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "a record literal without parentheses in the head of an if is refused with E1101"
category: syntax
profile: cpu

input:
  source: |
    struct P {
        x: i64,
        y: i64,
    }

    fn main() -> i64 {
        let p = P { x: 1, y: 2 };
        if p == P { x: 1, y: 2 } {
            return 1;
        }
        return 0;
    }

expected:
  status: error
  error:
    code: E1101
