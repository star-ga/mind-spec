# MIND Conformance Test: a reshape marker next to an entry 0
# Specification reference: spec/v1.0/ir.md#shape-manipulation
# Category: syntax
# Profile: cpu

description: "the entry 0 leaves the dimension at the marker -1 without a value"
category: syntax
profile: cpu

input:
  source: |
    fn f(t: Tensor<f32, [0, 3]>) -> i64 {
        let r = reshape(t, [0, -1]);
        return 0;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E3007
