# MIND Conformance Test: a loop exit needs its ;
# Specification reference: spec/v1.0/language.md#statement-separators
# Category: syntax
# Profile: cpu

description: "the loop exit needs its ;, so while c { break } is refused"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let mut i = 0;
        while i < 3 {
            i = i + 1;
            break
        }
        return i;
    }

expected:
  status: error
