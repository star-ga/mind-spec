# MIND Conformance Test: loop is not a keyword and can be a name; the program returns 1
# Specification reference: spec/v1.0/language.md#loop-exits
# Category: syntax
# Profile: cpu

description: "let loop = 1; return loop; binds and returns the name loop; the program returns 1"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let loop = 1;
        return loop;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 1
