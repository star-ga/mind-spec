# MIND Conformance Test: loop is a name after while
# Specification reference: spec/v1.0/language.md#loop-exits
# Category: syntax
# Profile: cpu

description: "where an expression starts, loop is a name: while loop { } is a loop on the bool loop; the program returns 3"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let loop = false;
        while loop { }
        return 3;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 3
