# MIND Conformance Test: x<<=1 with no spaces is the operator <<= of joined tokens; the program returns 4
# Specification reference: spec/v1.0/lexical.md#tokens
# Category: syntax
# Profile: cpu

description: "x<<=1 is x <<= 1: the joined tokens <, < and = form the operator; the program returns 4"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let mut x = 2;
        x<<=1;
        return x;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 4
