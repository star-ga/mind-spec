# MIND Conformance Test: x %= e is x = x % e, so an f64 x and an f32 e are a dtype mismatch
# Specification reference: spec/v1.0/language.md#bindings-and-assignment
# Category: syntax
# Profile: cpu

description: "x %= y with x: f64 and y: f32 is refused with E2004"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let mut x: f64 = 7.5;
        let y: f32 = 2.0;
        x %= y;
        return 0;
    }

expected:
  status: error
  error:
    code: E2004
