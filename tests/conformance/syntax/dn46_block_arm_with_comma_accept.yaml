# MIND Conformance Test: every arm ends with a comma, a block arm too
# Specification reference: spec/v1.0/language.md#patterns-and-match
# Decision: DN-46 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "every arm ends with a comma, a block arm too; the program returns 3"
category: syntax
profile: cpu

input:
  source: |
    fn f(x: i64) -> i64 {
        return match x {
            0 => { 1 },
            _ => { 3 },
        };
    }

    fn main() -> i64 {
        return f(5);
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 3
