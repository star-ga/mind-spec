# MIND Conformance Test: << with an f64 left operand
# Specification reference: spec/v1.0/language.md#bitwise-and-shift-operators
# Category: syntax
# Profile: cpu

description: "the left operand of << has an integer type; an f64 operand is refused with E2005"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x: f64 = 1.5;
        let c = x << 2;
        return 0;
    }

expected:
  status: error
  error:
    code: E2005
