# MIND Conformance Test: << with two f64 operands
# Specification reference: spec/v1.0/language.md#bitwise-and-shift-operators
# Category: syntax
# Profile: cpu

description: "the operands of << have integer types; two f64 operands are refused with E2005"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x: f64 = 1.5;
        let y: f64 = 2.0;
        let c = x << y;
        return 0;
    }

expected:
  status: error
  error:
    code: E2005
