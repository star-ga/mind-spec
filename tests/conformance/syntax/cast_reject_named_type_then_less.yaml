# MIND Conformance Test: after another type name of a cast, < opens a type-argument list
# Specification reference: spec/v1.0/language.md#casts
# Category: syntax
# Profile: cpu

description: "x as Option < y; has no reading: the < after Option opens a type-argument list that is not closed"
category: syntax
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x: i64 = 3;
        let y: i64 = 5;
        let b = x as Option < y;
        return 0;
    }

expected:
  status: error
