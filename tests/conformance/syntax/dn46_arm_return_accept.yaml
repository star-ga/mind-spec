# MIND Conformance Test: an arm body may be return e
# Specification reference: spec/v1.0/language.md#patterns-and-match
# Decision: DN-46 (design/rfcs/decision-notes-3.md)
# Category: syntax
# Profile: cpu

description: "an arm body may be return e; the program returns 9"
category: syntax
profile: cpu

input:
  source: |
    fn f(x: i64) -> i64 {
        let y = match x {
            0 => return 9,
            _ => 1,
        };
        return y;
    }

    fn main() -> i64 {
        return f(0);
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 9
