# MIND Conformance Test: an assignment to a parameter is refused with E2402
# Specification reference: spec/v1.0/language.md#bindings-and-assignment
# Category: syntax
# Profile: cpu

description: "a parameter is not mutable; x = 2; in its function is refused with E2402"
category: syntax
profile: cpu

input:
  source: |
    fn f(x: i64) -> i64 {
        x = 2;
        return x;
    }

    fn main() -> i64 {
        return f(1);
    }

expected:
  status: error
  error:
    code: E2402
