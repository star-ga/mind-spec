# MIND Conformance Test: a dimension above 2^63 - 1 is refused with E3012
# Specification reference: spec/v1.0/shapes.md#the-tensor-type
# Decision: DN-71 (design/rfcs/decision-notes-3.md)
# Category: shapes
# Profile: cpu

description: "a dimension above 2^63 - 1 is refused with E3012"
category: shapes
profile: cpu

input:
  source: |
    fn f(x: Tensor<f32, [9223372036854775808]>) -> i64 {
        return 0;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E3012
