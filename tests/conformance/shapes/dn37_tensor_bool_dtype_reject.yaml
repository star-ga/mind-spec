# Decision: DN-37 (design/rfcs/decision-notes-3.md)
# Category: shapes
# Profile: cpu

description: "Tensor<bool, [2]> is refused with E2005, which names the dtypes"
category: shapes
profile: cpu

input:
  source: |
    fn f(x: Tensor<bool, [2]>) -> i64 {
        return 0;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E2005
