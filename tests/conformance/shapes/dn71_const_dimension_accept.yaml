# MIND Conformance Test: a dimension names a const of the type i64
# Specification reference: spec/v1.0/shapes.md#the-tensor-type
# Decision: DN-71 (design/rfcs/decision-notes-3.md)
# Category: shapes
# Profile: cpu

description: "a dimension names a const of the type i64; the program returns 0"
category: shapes
profile: cpu

input:
  source: |
    const N: i64 = 3;

    fn f(x: Tensor<f32, [N]>) -> i64 {
        return 0;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 0
