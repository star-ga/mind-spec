# MIND Conformance Test: a plain operator on two tensors of different shapes is refused
# Specification reference: spec/v1.0/shapes.md#elementwise-binary
# Decision: DN-81 (design/rfcs/decision-notes-3.md)
# Category: shapes
# Profile: cpu

description: "a plain operator on two tensors of different shapes is refused; the message gives the dotted form"
category: shapes
profile: cpu

input:
  source: |
    fn f(col: Tensor<f32, [3, 1]>, row: Tensor<f32, [1, 4]>) -> Tensor<f32, [3, 4]> {
        return col * row;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E3015
    location:
      line: 2
      column: 16
  fix:
    class: TYPED
    source: |
      fn f(col: Tensor<f32, [3, 1]>, row: Tensor<f32, [1, 4]>) -> Tensor<f32, [3, 4]> {
          return col .* row;
      }

      fn main() -> i64 {
          return 0;
      }
