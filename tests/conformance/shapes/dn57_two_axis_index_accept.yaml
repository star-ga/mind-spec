# MIND Conformance Test: t[1, 2] on a rank-2 tensor is an f32
# Specification reference: spec/v1.0/shapes.md#indexing-a-tensor
# Decision: DN-57 (design/rfcs/decision-notes-3.md)
# Category: shapes
# Profile: cpu

description: "t[1, 2] on a rank-2 tensor is an f32; the program returns 0"
category: shapes
profile: cpu

input:
  source: |
    fn f(t: Tensor<f32, [2, 3]>) -> f32 {
        return t[1, 2];
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 0
