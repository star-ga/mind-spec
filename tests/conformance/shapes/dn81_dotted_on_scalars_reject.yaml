# MIND Conformance Test: a dotted operator with no tensor operand is refused
# Specification reference: spec/v1.0/shapes.md#elementwise-binary
# Decision: DN-81 (design/rfcs/decision-notes-3.md)
# Category: shapes
# Profile: cpu

description: "a dotted operator with no tensor operand is refused"
category: shapes
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let a: i64 = 6;
        let b: i64 = 3;
        return a .+ b;
    }

expected:
  status: error
  error:
    code: E3016
    location:
      line: 4
      column: 14
  fix:
    class: TYPED
    source: |
      fn main() -> i64 {
          let a: i64 = 6;
          let b: i64 = 3;
          return a + b;
      }
