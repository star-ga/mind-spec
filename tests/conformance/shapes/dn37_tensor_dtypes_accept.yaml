description: "Tensor takes each dtype of Core v1 and a shape; the program returns 0"
category: shapes
profile: cpu

input:
  source: |
    fn f(a: Tensor<i32, [2]>, b: Tensor<i64, [2]>, c: Tensor<f32, [2]>, d: Tensor<f64, [2]>) -> i64 {
        return 0;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 0
