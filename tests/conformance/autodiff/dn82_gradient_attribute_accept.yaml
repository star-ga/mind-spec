# MIND Conformance Test: #[grad(dsq, x)] declares dsq
# Specification reference: spec/v1.0/autodiff.md#source-form-the-gradient-attribute
# Decision: DN-82 (design/rfcs/decision-notes-3.md)
# Category: autodiff
# Profile: cpu

description: "#[grad(dsq, x)] declares dsq; dsq(3.0) is 6.0 and the program returns 0"
category: autodiff
profile: cpu

input:
  source: |
    #[grad(dsq, x)]
    fn sq(x: f64) -> f64 {
        return x * x;
    }

    fn main() -> i64 {
        let d = dsq(3.0);
        if d == 6.0 {
            return 0;
        }
        return 1;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 0
