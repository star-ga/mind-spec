# MIND Conformance Test: diff in a type position is refused with E1105, which gives the attribute
# Specification reference: spec/v1.0/autodiff.md#source-form-the-gradient-attribute
# Decision: DN-82 (design/rfcs/decision-notes-3.md)
# Category: autodiff
# Profile: cpu

description: "diff in a type position is refused with E1105, which gives the attribute"
category: autodiff
profile: cpu

input:
  source: |
    fn f(a: diff Tensor<f32, [2]>) -> i64 { return 0; }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E1105
    message_contains: "#[grad("
    location:
      line: 1
      column: 9
