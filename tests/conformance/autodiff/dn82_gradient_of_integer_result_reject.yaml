# MIND Conformance Test: #[grad(dsq, x)] on a function whose result is i64 is refused
# Specification reference: spec/v1.0/autodiff.md#source-form-the-gradient-attribute
# Decision: DN-82 (design/rfcs/decision-notes-3.md)
# Category: autodiff
# Profile: cpu

description: "#[grad(dsq, x)] on a function whose result is i64 is refused"
category: autodiff
profile: cpu

input:
  source: |
    #[grad(dsq, x)]
    fn sq(x: f64) -> i64 {
        return 1;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
