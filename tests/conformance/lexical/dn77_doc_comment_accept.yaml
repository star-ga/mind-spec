# MIND Conformance Test: /// documents the item that follows it
# Specification reference: spec/v1.0/lexical.md#comments-and-whitespace
# Decision: DN-77 (design/rfcs/decision-notes-3.md)
# Category: lexical
# Profile: cpu

description: "/// documents the item that follows it; the program returns 2"
category: lexical
profile: cpu

input:
  source: |
    /// adds one
    fn f(x: i64) -> i64 {
        return x + 1;
    }

    fn main() -> i64 {
        return f(1);
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 2
