# MIND Conformance Test: a quoted string ends on its line
# Specification reference: spec/v1.0/lexical.md#literals
# Decision: DN-62 (design/rfcs/decision-notes-3.md)
# Category: lexical
# Profile: cpu

description: "a quoted string ends on its line; a line end inside it is refused with E1003 at the opening quote"
category: lexical
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let s = "abc
    def";
        return 1;
    }

expected:
  status: error
  error:
    code: E1003
    location:
      line: 2
      column: 13
