# MIND Conformance Test: a function named tensor is refused with E1007 at the word
# Specification reference: spec/v1.0/lexical.md#keywords
# Decision: DN-38 (design/rfcs/decision-notes-3.md)
# Category: lexical
# Profile: cpu

description: "a function named tensor is refused with E1007 at the word"
category: lexical
profile: cpu

input:
  source: |
    fn tensor(x: i64) -> i64 {
        return x;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E1007
    location:
      line: 1
      column: 4
