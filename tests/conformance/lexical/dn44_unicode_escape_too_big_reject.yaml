# MIND Conformance Test: "\u{110000}" is above 10FFFF and is refused with E1004
# Specification reference: spec/v1.0/lexical.md#literals
# Decision: DN-44 (design/rfcs/decision-notes-3.md)
# Category: lexical
# Profile: cpu

description: "\"\\u{110000}\" is above 10FFFF and is refused with E1004"
category: lexical
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let s = "\u{110000}";
        return 0;
    }

expected:
  status: error
  error:
    code: E1004
