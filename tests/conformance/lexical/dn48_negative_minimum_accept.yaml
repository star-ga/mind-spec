# MIND Conformance Test: the operator - applied to 2147483648 is one negative value that i32 holds
# Specification reference: spec/v1.0/lexical.md#literals
# Decision: DN-48 (design/rfcs/decision-notes-3.md)
# Category: lexical
# Profile: cpu

description: "the operator - applied to 2147483648 is one negative value that i32 holds; the program returns 0"
category: lexical
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let m: i32 = -2147483648;
        return 0;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 0
