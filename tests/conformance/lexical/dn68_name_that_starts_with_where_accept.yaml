# MIND Conformance Test: whereas is a name
# Specification reference: spec/v1.0/lexical.md#keywords
# Decision: DN-68 (design/rfcs/decision-notes-3.md)
# Category: lexical
# Profile: cpu

description: "whereas is a name; the program returns 2"
category: lexical
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let whereas = 2;
        return whereas;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 2
