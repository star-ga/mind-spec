# MIND Conformance Test: each function has its own parameter list
# Specification reference: spec/v1.0/language.md#module-level
# Decision: DN-30 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "each function has its own parameter list; the program returns 3"
category: type_checker
profile: cpu

input:
  source: |
    fn f(x: i64) -> i64 {
        return x;
    }

    fn g(x: i64) -> i64 {
        return x + 1;
    }

    fn main() -> i64 {
        return f(1) + g(1);
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 3
