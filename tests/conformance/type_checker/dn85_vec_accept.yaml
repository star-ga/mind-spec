# MIND Conformance Test: the growable sequence is Vec<i64>
# Specification reference: spec/v1.0/types.md#type-formation
# Decision: DN-85 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "the growable sequence is Vec<i64>; the program returns 2"
category: type_checker
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let xs: Vec<i64> = [1, 2];
        return xs[1];
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 2
