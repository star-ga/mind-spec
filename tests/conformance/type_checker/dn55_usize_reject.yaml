# MIND Conformance Test: usize is not a type and is refused with E2002, whose message gives u64
# Specification reference: spec/v1.0/types.md#type-formation
# Decision: DN-55 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "usize is not a type and is refused with E2002, whose message gives u64"
category: type_checker
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let n: usize = 1;
        return 0;
    }

expected:
  status: error
  error:
    code: E2002
    message_contains: "u64"
