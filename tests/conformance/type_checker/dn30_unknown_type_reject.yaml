description: "an unknown type name is refused with E2002"
category: type_checker
profile: cpu

input:
  source: |
    fn f(x: Nope) -> i64 {
        return 0;
    }

    fn main() -> i64 {
        return 0;
    }

expected:
  status: error
  error:
    code: E2002
