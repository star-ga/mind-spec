# MIND Conformance Test: a refutable pattern in a let is refused with E2310
# Specification reference: spec/v1.0/language.md#patterns-and-match
# Decision: DN-66 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "the pattern of a let MUST be irrefutable; let Some(x) = o; is refused with E2310 at the pattern"
category: type_checker
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let o: Option<i64> = Some(3);
        let Some(x) = o;
        return x;
    }

expected:
  status: error
  error:
    code: E2310
    location:
      line: 3
      column: 9
