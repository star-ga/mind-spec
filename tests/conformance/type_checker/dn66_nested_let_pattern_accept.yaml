# MIND Conformance Test: let takes a nested tuple pattern
# Specification reference: spec/v1.0/language.md#patterns-and-match
# Decision: DN-66 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "let takes a nested tuple pattern; the program returns 6"
category: type_checker
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let ((a, b), c) = ((1, 2), 3);
        return a + b + c;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 6
