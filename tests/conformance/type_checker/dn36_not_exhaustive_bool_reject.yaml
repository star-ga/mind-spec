# MIND Conformance Test: a match over bool with no false arm is refused with E2311, which names false
# Specification reference: spec/v1.0/language.md#patterns-and-match
# Decision: DN-36 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "a match over bool with no false arm is refused with E2311, which names false"
category: type_checker
profile: cpu

input:
  source: |
    fn f(b: bool) -> i64 {
        return match b {
            true => 1,
        };
    }

    fn main() -> i64 {
        return f(true);
    }

expected:
  status: error
  error:
    code: E2311
    message_contains: "false"
