# MIND Conformance Test: ! on an integer is refused with E2005
# Specification reference: spec/v1.0/language.md#operand-and-condition-types
# Decision: DN-23 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "! on an integer is refused with E2005"
category: type_checker
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x = !5;
        return 0;
    }

expected:
  status: error
  error:
    code: E2005
