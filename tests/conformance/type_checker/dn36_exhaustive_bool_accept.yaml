# MIND Conformance Test: a match that covers true and false
# Specification reference: spec/v1.0/language.md#patterns-and-match
# Decision: DN-36 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "a match that covers true and false; the program returns 1"
category: type_checker
profile: cpu

input:
  source: |
    fn f(b: bool) -> i64 {
        return match b {
            true => 1,
            false => 0,
        };
    }

    fn main() -> i64 {
        return f(true);
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 1
