# MIND Conformance Test: (i64,) is the tuple type of one element
# Specification reference: spec/v1.0/types.md#type-formation
# Decision: DN-58 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "(i64,) is the tuple type of one element; the program returns 5"
category: type_checker
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let t: (i64,) = (5,);
        return t.0;
    }

expected:
  status: success
  output:
    result:
      dtype: i64
      shape: []
      values: 5
