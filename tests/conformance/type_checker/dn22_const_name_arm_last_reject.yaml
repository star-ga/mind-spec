# MIND Conformance Test: an unguarded last arm named like a const item is refused with E2314
# Specification reference: spec/v1.0/language.md#patterns-and-match
# Decision: DN-22 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "an unguarded last arm named like a const item is refused with E2314"
category: type_checker
profile: cpu

input:
  source: |
    const K: i64 = 1;

    fn main() -> i64 {
        let x = 1;
        return match x {
            0 => 5,
            K => 10,
        };
    }

expected:
  status: error
  error:
    code: E2314
    location:
      line: 7
      column: 9
