# MIND Conformance Test: 256 is outside the range of u8 and is refused with E2408
# Specification reference: spec/v1.0/types.md#type-formation
# Decision: DN-55 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "256 is outside the range of u8 and is refused with E2408"
category: type_checker
profile: cpu

input:
  source: |
    fn main() -> i64 {
        let x: u8 = 256;
        return 0;
    }

expected:
  status: error
  error:
    code: E2408
