# MIND Conformance Test: a second function f is refused with E2720 at the second declaration
# Specification reference: spec/v1.0/language.md#module-level
# Decision: DN-30 (design/rfcs/decision-notes-3.md)
# Category: type_checker
# Profile: cpu

description: "a second function f is refused with E2720 at the second declaration"
category: type_checker
profile: cpu

input:
  source: |
    fn f() -> i64 {
        return 1;
    }

    fn f() -> i64 {
        return 2;
    }

    fn main() -> i64 {
        return f();
    }

expected:
  status: error
  error:
    code: E2720
