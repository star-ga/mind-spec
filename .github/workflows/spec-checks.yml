name: Specification checks

# The checks of tools/tests: the grammar lint and its lookahead budget (DN-86), the reserved word list against the
# Keyword rule, the error code table against the error catalog (DN-87), the grammar tokens, the core IR tools and
# the site links.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tools-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Run the checks
        run: python3 -m pytest tools/tests -q -p no:cacheprovider
